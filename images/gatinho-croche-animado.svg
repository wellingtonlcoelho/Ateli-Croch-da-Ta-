<svg viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Gatinho fazendo crochê">
  <style>
    .olhos{transform-box:fill-box;transform-origin:center;animation:piscar 4.6s ease-in-out infinite}@keyframes piscar{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY:.15}}
    .bigode-esq{transform-box:fill-box;transform-origin:100% 50%;animation:bigode 3.2s ease-in-out infinite}.bigode-dir{transform-box:fill-box;transform-origin:0 50%;animation:bigode 3.2s ease-in-out infinite;animation-delay:.15s}@keyframes bigode{0%,80%,100%{transform:rotate(0)}90%{transform:rotate(-4deg)}}
    .agulha-esq{transform-origin:144px 216px;animation:tricotar-esq 1.5s ease-in-out infinite}@keyframes tricotar-esq{0%,100%{transform:rotate(0)}50%{transform:rotate(-10deg)}}
    .agulha-dir{transform-origin:190px 216px;animation:tricotar-dir 1.5s ease-in-out infinite}@keyframes tricotar-dir{0%,100%{transform:rotate(0)}50%{transform:rotate(10deg)}}
    .fio-conector{transform-box:fill-box;transform-origin:0 0;animation:balancar 2.6s ease-in-out infinite}@keyframes balancar{0%,100%{transform:rotate(0)}50%{transform:rotate(3deg)}}
    .bola-de-la{transform-box:fill-box;transform-origin:center;animation:girar 7s linear infinite}@keyframes girar{to{transform:rotate(360deg)}}
    .trico{transform-box:fill-box;transform-origin:50% 100%;animation:crescer 1.5s ease-in-out infinite}@keyframes crescer{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.035)}}
    @media(prefers-reduced-motion:reduce){.olhos,.bigode-esq,.bigode-dir,.agulha-esq,.agulha-dir,.fio-conector,.bola-de-la,.trico{animation:none}}
  </style>
  <circle fill="#9B7FBF" cx="160" cy="170" r="140"/>
  <circle fill="#D9CBEC" cx="247" cy="88" r="60"/>
  <polygon fill="#FAF7F3" points="112,128 138,60 158,118"/><polygon fill="#FAF7F3" points="208,128 182,60 162,118"/>
  <ellipse fill="#FAF7F3" cx="160" cy="148" rx="72" ry="58"/>
  <g class="bigode-esq" fill="none" stroke="#55396F" stroke-width="2.4" stroke-linecap="round"><path d="M98 148L58 138"/><path d="M96 158L56 158"/><path d="M98 168L58 176"/></g>
  <g class="bigode-dir" fill="none" stroke="#55396F" stroke-width="2.4" stroke-linecap="round"><path d="M222 148L262 138"/><path d="M224 158L264 158"/><path d="M222 168L262 176"/></g>
  <g class="olhos" fill="#332741"><circle cx="134" cy="148" r="7.5"/><circle cx="186" cy="148" r="7.5"/></g>
  <path d="M144 174c6 9 26 9 32 0" fill="none" stroke="#55396F" stroke-width="3.2" stroke-linecap="round"/>
  <g class="bola-de-la"><circle fill="#B394D6" cx="236" cy="238" r="21"/><path d="M217 232c8-6 20-6 28 3M216 240c9-4 22-2 30 5M219 247c8-2 18 0 24 5" fill="none" stroke="#8A66B8" stroke-width="1.6" stroke-linecap="round"/></g>
  <path class="fio-conector" d="M198 224c14 3 24 7 33 12" fill="none" stroke="#55396F" stroke-width="2"/>
  <g class="trico"><rect fill="#C9AEE0" x="133" y="220" width="68" height="46" rx="10"/><path d="M141 230l9 10 9-10 9 10 9-10 9 10 9-10M141 245l9 10 9-10 9 10 9-10 9 10 9-10M141 260l9 5 9-5 9 5 9-5 9 5 9-5" fill="none" stroke="#7C5AA6" stroke-width="1.8" stroke-linecap="round"/></g>
  <ellipse fill="#FAF7F3" cx="144" cy="216" rx="16" ry="14"/><ellipse fill="#FAF7F3" cx="190" cy="216" rx="16" ry="14"/>
  <g class="agulha-esq"><line x1="144" y1="216" x2="176" y2="188" stroke="#C9A227" stroke-width="6" stroke-linecap="round"/></g>
  <g class="agulha-dir"><line x1="190" y1="216" x2="158" y2="188" stroke="#C9A227" stroke-width="6" stroke-linecap="round"/></g>
</svg>
