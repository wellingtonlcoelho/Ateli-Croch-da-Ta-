<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Ateliê da Tá</title>
  <link rel="stylesheet" href="index.css">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <a href="index.html" class="logo">Ateliê da Tá</a>
  </header>

  <main style="display: flex; justify-content: center; align-items: center; min-height: 70vh;">
    <div style="background: white; padding: 2.5rem; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); width: 100%; max-width: 400px; margin: 2rem;">
      <h2 style="text-align: center; color: var(--text-dark); margin-bottom: 1.5rem;">Entrar</h2>
      
      <form id="login-form" style="display: flex; flex-direction: column; gap: 1rem;">
        <div id="error-msg" style="color: #d9534f; text-align: center; display: none; background: #fdf2f2; padding: 0.5rem; border-radius: 8px;"></div>
        
        <input type="email" id="email" placeholder="Seu E-mail" required style="padding: 1rem; border: 1px solid #ddd; border-radius: 8px; font-family: inherit; font-size: 1rem;">
        <input type="password" id="senha" placeholder="Sua Senha" required style="padding: 1rem; border: 1px solid #ddd; border-radius: 8px; font-family: inherit; font-size: 1rem;">
        
        <button type="submit" class="btn" style="width: 100%; margin-top: 1rem; padding: 1rem; font-size: 1.1rem;">Entrar</button>
      </form>
      
      <p style="text-align: center; margin-top: 1.5rem; font-size: 0.95rem; color: #666;">
        Não tem conta? <a href="cadastro.html" style="color: var(--primary); text-decoration: none; font-weight: 500;">Crie agora</a>
      </p>
    </div>
  </main>

  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const senha = document.getElementById('senha').value;
      const errorMsg = document.getElementById('error-msg');
      const btn = e.target.querySelector('button');
      
      errorMsg.style.display = 'none';
      btn.innerText = 'Entrando...';
      btn.disabled = true;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, senha })
        });
        const data = await res.json();
        
        if (res.ok) {
          localStorage.setItem('auth_token', data.token);
          localStorage.setItem('user', JSON.stringify(data.usuario));
          
          if (data.usuario.role === 'admin') {
            window.location.href = 'admin.html';
          } else {
            window.location.href = 'meus-pedidos.html';
          }
        } else {
          errorMsg.innerText = data.erro || 'Erro ao fazer login';
          errorMsg.style.display = 'block';
        }
      } catch (err) {
        errorMsg.innerText = 'Erro de conexão. Tente novamente.';
        errorMsg.style.display = 'block';
      } finally {
        btn.innerText = 'Entrar';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
