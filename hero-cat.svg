<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img" aria-labelledby="title desc">
  <title id="title">Gatinho crocheteiro</title>
  <desc id="desc">Ilustração de um gatinho fazendo crochê em um fundo roxo.</desc>
  <style>
    .orelha { animation: orelha 4s ease-in-out infinite; transform-origin: center; }
    .agulha { animation: agulha 1.1s ease-in-out infinite alternate; transform-origin: 50% 50%; }
    .mao { animation: mao 1.1s ease-in-out infinite alternate; transform-origin: center; }
    .novelo { animation: novelo 2.8s ease-in-out infinite; transform-origin: center; }
    .linha { stroke-dasharray: 8 12; animation: linha 1.9s linear infinite; }
    .pata { animation: pata 1.1s ease-in-out infinite alternate; transform-origin: center; }
    @keyframes orelha { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes agulha { 0% { transform: rotate(-14deg) translate(-2px, 2px); } 100% { transform: rotate(18deg) translate(3px, -2px); } }
    @keyframes mao { 0% { transform: translateY(0); } 100% { transform: translateY(-3px); } }
    @keyframes novelo { 0%,100% { transform: rotate(0deg) translateY(0); } 50% { transform: rotate(8deg) translateY(-2px); } }
    @keyframes linha { to { stroke-dashoffset: -40; } }
    @keyframes pata { 0% { transform: translateX(0); } 100% { transform: translateX(2px); } }
    @media (prefers-reduced-motion: reduce) {
      .orelha, .agulha, .mao, .novelo, .linha, .pata { animation: none; }
    }
  </style>

  <defs>
    <linearGradient id="bgGrad" x1="0" x2="1">
      <stop offset="0%" stop-color="#B58ED3"/>
      <stop offset="100%" stop-color="#9B7FBF"/>
    </linearGradient>
  </defs>

  <circle cx="250" cy="240" r="210" fill="url(#bgGrad)"/>
  <circle cx="387" cy="80" r="72" fill="#D9CBEC"/>

  <g class="orelha">
    <path d="M180 160 L150 95 L205 120 Z" fill="#F9F6F4"/>
    <path d="M320 160 L350 95 L295 120 Z" fill="#F9F6F4"/>
  </g>

  <g>
    <circle cx="250" cy="230" r="92" fill="#F9F6F4"/>
    <path d="M175 205 C180 146 203 122 250 122 C297 122 320 146 325 205 L325 250 C325 276 301 298 250 298 C199 298 175 276 175 250 Z" fill="#F9F6F4"/>

    <circle cx="214" cy="208" r="8" fill="#332741"/>
    <circle cx="286" cy="208" r="8" fill="#332741"/>

    <path d="M218 245 C234 259 266 259 282 245" fill="none" stroke="#332741" stroke-width="6" stroke-linecap="round"/>

    <g fill="none" stroke="#332741" stroke-width="5" stroke-linecap="round">
      <path d="M202 167 L170 184"/>
      <path d="M198 181 L165 191"/>
      <path d="M298 167 L330 184"/>
      <path d="M302 181 L335 191"/>
    </g>
  </g>

  <g fill="#F9F6F4">
    <path class="mao" d="M182 300 C163 304 150 320 156 335 C162 350 179 355 193 344 L209 330 L199 297 Z"/>
    <path class="mao" d="M318 300 C337 304 350 320 344 335 C338 350 321 355 307 344 L291 330 L301 297 Z"/>
  </g>

  <g class="pata">
    <path d="M185 322 L170 365 L202 360 L216 332 Z" fill="#F9F6F4"/>
    <path d="M315 322 L330 365 L298 360 L284 332 Z" fill="#F9F6F4"/>
  </g>

  <g transform="translate(175 300)">
    <path d="M18 18 C10 6 18 -10 34 -10 C48 -10 61 -2 66 12 C71 26 66 40 51 48 C38 56 24 58 13 52 C3 46 0 31 18 18 Z" fill="#D9CBEC"/>
    <path d="M15 20 C30 30 50 30 66 20 M15 40 C31 50 50 50 66 40 M15 60 C31 70 48 70 66 60" fill="none" stroke="#B79AD4" stroke-width="6" stroke-linecap="round"/>
    <path d="M32 10 L40 62 M49 8 L55 68 M66 12 L60 67" fill="none" stroke="#B79AD4" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  </g>

  <g class="agulha">
    <path d="M225 323 L270 268" stroke="#332741" stroke-width="7" stroke-linecap="round"/>
    <path d="M270 268 L285 254" stroke="#332741" stroke-width="7" stroke-linecap="round"/>
    <path d="M225 323 L214 337" stroke="#332741" stroke-width="7" stroke-linecap="round"/>
    <path d="M270 268 L273 242" stroke="#E0B14A" stroke-width="6" stroke-linecap="round"/>
  </g>

  <g class="novelo">
    <circle cx="361" cy="358" r="42" fill="#F0E8F6"/>
    <path d="M331 367 C343 338 375 335 391 360 C400 376 389 399 365 401 C346 404 333 388 331 367 Z" fill="none" stroke="#B79AD4" stroke-width="5"/>
    <path class="linha" d="M347 390 C322 417 312 423 290 409 C278 401 275 385 265 378" fill="none" stroke="#F0E8F6" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
