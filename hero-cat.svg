<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" role="img" aria-labelledby="title desc">
  <title id="title">Gatinho fazendo crochê</title>
  <desc id="desc">Gatinho branco fazendo crochê dentro de uma bola roxa, com novelo de lã ao lado.</desc>
  <style>
    .paw-left { animation: movePawL .6s infinite alternate ease-in-out; transform-origin: 195px 265px; }
    .paw-right { animation: movePawR .6s infinite alternate-reverse ease-in-out; transform-origin: 270px 260px; }
    .needle { animation: moveNeedle .6s infinite alternate ease-in-out; transform-origin: 235px 260px; }
    @keyframes movePawL { 0% { transform: translateY(0) rotate(0); } 100% { transform: translateY(4px) rotate(-8deg); } }
    @keyframes movePawR { 0% { transform: translateY(0) rotate(0); } 100% { transform: translateY(-4px) rotate(8deg); } }
    @keyframes moveNeedle { 0% { transform: rotate(0) translateX(0); } 100% { transform: rotate(-4deg) translateX(-3px); } }
    @media (prefers-reduced-motion: reduce) { .paw-left, .paw-right, .needle { animation: none; } }
  </style>

  <rect width="500" height="500" fill="#f4ece7" />
  <circle cx="250" cy="260" r="210" fill="#9376bc" />
  <circle cx="410" cy="110" r="75" fill="#d5c6ea" />

  <polygon points="190,200 175,110 235,145" fill="#ffffff" />
  <polygon points="310,200 325,110 265,145" fill="#ffffff" />

  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round">
    <line x1="140" y1="205" x2="165" y2="210"/><line x1="140" y1="220" x2="165" y2="220"/><line x1="145" y1="235" x2="170" y2="228"/>
    <line x1="360" y1="205" x2="335" y2="210"/><line x1="360" y1="220" x2="335" y2="220"/><line x1="355" y1="235" x2="330" y2="228"/>
  </g>

  <ellipse cx="250" cy="215" rx="85" ry="70" fill="#ffffff" />
  <circle cx="220" cy="205" r="7.5" fill="#2d273a" /><circle cx="280" cy="205" r="7.5" fill="#2d273a" />
  <path d="M235 230 Q250 245 265 230" fill="none" stroke="#2d273a" stroke-width="4.5" stroke-linecap="round" />

  <path d="M280 340 Q320 380 350 325" fill="none" stroke="#c4aee0" stroke-width="5" />
  <circle cx="350" cy="315" r="24" fill="#c4aee0" />
  <g fill="none" stroke="#ffffff" stroke-width="2.5" opacity=".6">
    <path d="M333 303 Q350 295 367 310"/><path d="M330 320 Q350 335 370 318"/><path d="M345 292 Q340 315 355 338"/>
  </g>

  <path d="M215 275 L265 265 L285 340 L215 330 Z" fill="#c4aee0" />
  <g stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity=".8">
    <path d="M225 285 L230 290 L235 285 M245 282 L250 287 L255 282"/>
    <path d="M228 302 L233 307 L238 302 M248 299 L253 304 L258 299 M268 296 L273 301 L278 296"/>
    <path d="M230 318 L235 323 L240 318 M250 315 L255 320 L260 315 M270 312 L275 317 L280 312"/>
  </g>

  <g class="needle">
    <line x1="175" y1="295" x2="235" y2="255" stroke="#3b2d42" stroke-width="7" stroke-linecap="round" />
    <line x1="230" y1="260" x2="310" y2="295" stroke="#b28d54" stroke-width="7" stroke-linecap="round" />
  </g>

  <g class="paw-left">
    <ellipse cx="195" cy="275" rx="22" ry="19" fill="#ffffff" transform="rotate(-15 195 275)" />
    <path d="M185 272 Q192 265 198 268 M195 285 Q202 278 208 281" fill="none" stroke="#9376bc" stroke-width="2.5" stroke-linecap="round" />
  </g>
  <g class="paw-right">
    <ellipse cx="275" cy="270" rx="22" ry="19" fill="#ffffff" transform="rotate(15 275 270)" />
    <path d="M282 265 Q275 260 268 263 M275 280 Q268 275 261 278" fill="none" stroke="#9376bc" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>
