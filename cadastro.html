<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - Ateliê da Tá</title>
  <link rel="stylesheet" href="index.css">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <a href="index.html" class="logo">Ateliê da Tá</a>
  </header>

  <main style="display: flex; justify-content: center; align-items: center; min-height: 70vh;">
    <div style="background: white; padding: 2.5rem; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); width: 100%; max-width: 400px; margin: 2rem;">
      <h2 style="text-align: center; color: var(--text-dark); margin-bottom: 1.5rem;">Criar Conta</h2>
      
      <form id="register-form" style="display: flex; flex-direction: column; gap: 1rem;">
        <div id="error-msg" style="color: #d9534f; text-align: center; display: none; background: #fdf2f2; padding: 0.5rem; border-radius: 8px;"></div>
        <div id="success-msg" style="color: #28a745; text-align: center; display: none; background: #f0fdf4; padding: 0.5rem; border-radius: 8px;">Cadastro realizado com sucesso! Redirecionando...</div>
        
        <input type="text" id="nome" placeholder="Seu Nome Completo" required style="padding: 1rem; border: 1px solid #ddd; border-radius: 8px; font-family: inherit; font-size: 1rem;">
        <input type="email" id="email" placeholder="Seu E-mail" required style="padding: 1rem; border: 1px solid #ddd; border-radius: 8px; font-family: inherit; font-size: 1rem;">
        <input type="password" id="senha" placeholder="Sua Senha" required minlength="6" style="padding: 1rem; border: 1px solid #ddd; border-radius: 8px; font-family: inherit; font-size: 1rem;">
        
        <button type="submit" class="btn" style="width: 100%; margin-top: 1rem; padding: 1rem; font-size: 1.1rem;">Cadastrar</button>
      </form>
      
      <p style="text-align: center; margin-top: 1.5rem; font-size: 0.95rem; color: #666;">
        Já tem conta? <a href="login.html" style="color: var(--primary); text-decoration: none; font-weight: 500;">Faça login</a>
      </p>
    </div>
  </main>

  <script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const nome = document.getElementById('nome').value;
      const email = document.getElementById('email').value;
      const senha = document.getElementById('senha').value;
      const errorMsg = document.getElementById('error-msg');
      const successMsg = document.getElementById('success-msg');
      const btn = e.target.querySelector('button');
      
      errorMsg.style.display = 'none';
      successMsg.style.display = 'none';
      btn.innerText = 'Cadastrando...';
      btn.disabled = true;

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nome, email, senha })
        });
        const data = await res.json();
        
        if (res.ok) {
          successMsg.style.display = 'block';
          setTimeout(() => { window.location.href = 'login.html'; }, 2000);
        } else {
          errorMsg.innerText = data.erro || 'Erro ao realizar cadastro';
          errorMsg.style.display = 'block';
          btn.innerText = 'Cadastrar';
          btn.disabled = false;
        }
      } catch (err) {
        errorMsg.innerText = 'Erro de conexão. Tente novamente.';
        errorMsg.style.display = 'block';
        btn.innerText = 'Cadastrar';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
